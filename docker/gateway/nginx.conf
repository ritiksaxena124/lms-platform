# One entry point for the whole product, on port 80.
#
# Why a gateway at all: the session cookie is scoped to `Domain=localtest.me` so one sign-in works in
# every portal, and the API's CORS allowlist is that same list of origins. A container network breaks
# neither on its own — but it does move every service off the port the browser was told to expect, and
# `*.localtest.me:3000` plus `:3001` plus `:3002` is not a thing a person types correctly. So each
# service keeps its own subdomain, exactly as in `apps/*/.env.example`, and the port number disappears.
#
# `localtest.me` resolves to 127.0.0.1 from public DNS, which is what makes this work on a laptop with
# no hosts-file edits. Inside the stack, services are reached by compose service name.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name teacher.localtest.me;

  location / {
    proxy_pass http://teacher:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name student.localtest.me;

  location / {
    proxy_pass http://student:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name ops.localtest.me;

  location / {
    proxy_pass http://ops:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name site.localtest.me localtest.me;

  location / {
    proxy_pass http://site:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name api.localtest.me;

  # A lesson video is attached through this route, and the API's own ceiling is MAX_UPLOAD_MB. The
  # gateway has to be at least as generous or the browser sees a connection reset instead of the
  # 413 it was answered.
  client_max_body_size 32m;

  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
