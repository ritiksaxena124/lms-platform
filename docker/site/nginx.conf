server {
  listen 80;
  server_name site.localtest.me localtest.me;

  root /usr/share/nginx/html;
  index index.html;

  # The export writes `/docs.html` while the links say `/docs`; resolving one to the other is this
  # host's half of the deal `apps/site/next.config.ts` records.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # The export writes its own themed 404 alongside index.html, so a miss gets the page a visitor was
  # meant to see rather than nginx's default.
  error_page 404 /404.html;

  location ~* \.(css|js|svg|png|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
